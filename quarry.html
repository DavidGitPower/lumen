<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>LUMEN</title>
<style>
/* ============ base ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#0b0d14}
body{position:fixed;inset:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#f2ead8}
#app{position:absolute;inset:0;margin:0 auto;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:#101321}
img{pointer-events:none;-webkit-user-drag:none}
/* ============ screens ============ */
.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.screen::before{content:"";position:absolute;inset:0;background-size:cover;background-position:center top;background-repeat:no-repeat;transition:filter 1s;z-index:0}
#sc-town::before{background-image:url("assets/backdrop_city.jpg");background-color:#101321}
#sc-shop::before{background-image:url("assets/backdrop_store.jpg")}
#sc-run.bio-mine::before{background-image:url("assets/backdrop_mine.jpg")}
#sc-run.bio-woods::before{background-image:url("assets/backdrop_woods.jpg")}
#sc-run.bio-lake::before{background-image:url("assets/backdrop_lake.jpg")}
#sc-run.dusk1::before{filter:brightness(.85) saturate(1.05) sepia(.12)}
#sc-run.dusk2::before{filter:brightness(.68) saturate(1.1) sepia(.22) hue-rotate(-12deg)}
#sc-run.dusk3::before{filter:brightness(.5) saturate(1.15) sepia(.3) hue-rotate(-24deg)}
/* ============ town ============ */
.tile{position:absolute;z-index:2;width:26%;aspect-ratio:1;border:none;background:transparent;padding:0}
.tile img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.tile .tname{position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-shadow:0 1px 3px #000;white-space:nowrap}
.tile.locked img{filter:grayscale(.9) brightness(.55)}
.tile .lock{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:rgba(10,10,16,.82);border:1px solid #b98d3e;border-radius:12px;padding:3px 8px;font-size:.72rem;font-weight:700;white-space:nowrap}
#t-mine{left:6%;top:13%}
#t-woods{right:7%;top:9%}
#t-lake{left:9%;top:33%}
#t-store{right:8%;top:30%}
#storagewrap{position:absolute;left:50%;bottom:31%;transform:translateX(-50%);z-index:3;width:88%;background:linear-gradient(#6b4a2b,#4e3520);border:3px solid #8a6234;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,220,160,.25);padding:8px}
#storagewrap h3{font-size:.68rem;letter-spacing:.14em;opacity:.8;text-align:center;margin-bottom:6px;font-weight:700}
#storage{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
#storage .slot{aspect-ratio:1;background:rgba(30,20,10,.55);border:1.5px solid rgba(190,140,70,.5);border-radius:9px}
/* ============ slots (shared) ============ */
.slot{position:relative;display:flex;align-items:center;justify-content:center}
.slot img{width:88%;height:88%;object-fit:contain}
.slot .emo{font-size:clamp(18px,6.4vw,30px);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.slot .tier{position:absolute;right:1px;bottom:0;font-size:.56rem;font-weight:800;color:#ffd97a;text-shadow:0 1px 2px #000}
.slot .cnt{position:absolute;right:0;top:-2px;background:#c8442e;color:#fff;font-size:.56rem;font-weight:800;border-radius:8px;padding:0 4px;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.slot.dragsrc>*{opacity:.25}
/* ============ bottom bar ============ */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:40;width:100%;aspect-ratio:1125/586}
#bar>img{position:absolute;inset:0;width:100%;height:100%}
#bar .hot{position:absolute}
#bar .slot{background:rgba(22,14,7,.5);border:1.5px solid rgba(255,215,150,.32);border-radius:12%;box-shadow:inset 0 2px 6px rgba(0,0,0,.55),0 1px 0 rgba(255,220,160,.15)}
#dayorb,#coinorb{display:flex;align-items:center;justify-content:center;font-weight:800;color:#3a2508;text-shadow:0 1px 0 rgba(255,255,255,.35);font-size:clamp(11px,3.6vw,16px);pointer-events:none}
#trashhex{z-index:41}
/* ============ expedition ============ */
#sunwrap{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);z-index:5;width:62%;max-width:300px}
#sunwrap .frame{position:relative;width:100%;aspect-ratio:380/110}
#sunwrap .frame>img{position:absolute;inset:0;width:100%;height:100%}
#sunfillzone{position:absolute;left:3.6%;top:28.9%;width:95.3%;height:54.5%;border-radius:999px;overflow:hidden;background:rgba(20,14,8,.6)}
#sunfill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#ff9d3c,#ffd069);border-radius:999px;transition:width .35s}
#suntext{position:absolute;right:7%;top:50%;transform:translateY(-50%);font-weight:800;font-size:clamp(12px,3.8vw,17px);color:#fff;text-shadow:0 1px 3px #000;z-index:2}
#roomlabel{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top) + 17vw);transform:translateX(-50%);z-index:5;font-size:.68rem;font-weight:700;letter-spacing:.16em;opacity:.85;text-shadow:0 1px 3px #000;white-space:nowrap}
@media (min-width:480px){#roomlabel{top:calc(10px + env(safe-area-inset-top) + 84px)}}
#nodes{position:absolute;inset:0;z-index:3}
.node{position:absolute;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);border:none;background:transparent;padding:0}
.node .nico{font-size:clamp(30px,11vw,52px);line-height:1;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.node img.nimg{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.55))}
.node .badge{position:absolute;right:-4%;top:-6%;background:rgba(12,10,18,.85);border:1px solid rgba(255,210,120,.6);border-radius:10px;font-size:.7rem;padding:1px 4px}
.node .pips{position:absolute;left:50%;bottom:-8%;transform:translateX(-50%);display:flex;gap:3px}
.node .pips i{width:7px;height:7px;border-radius:50%;background:#ffd069;box-shadow:0 1px 2px rgba(0,0,0,.6)}
.node .pips i.off{background:rgba(255,255,255,.25)}
.node.dead{opacity:.32;filter:grayscale(.6)}
.node.shake{animation:shk .18s}
@keyframes shk{0%{margin-left:0}25%{margin-left:-4px}60%{margin-left:4px}100%{margin-left:0}}
.doorbtn{position:absolute;bottom:33%;z-index:6;background:radial-gradient(circle at 50% 35%,#ffe9b0,#e2a83e 65%,#a06a1e);border:2px solid #fff0c8;border-radius:14px;color:#3a2508;font-weight:800;font-size:.72rem;padding:9px 10px;box-shadow:0 0 14px rgba(255,205,100,.65),0 4px 8px rgba(0,0,0,.5);animation:doorglow 1.6s infinite alternate}
@keyframes doorglow{from{box-shadow:0 0 8px rgba(255,205,100,.4),0 4px 8px rgba(0,0,0,.5)}to{box-shadow:0 0 18px rgba(255,215,120,.9),0 4px 8px rgba(0,0,0,.5)}}
#doorL{left:4%}#doorR{right:4%}
#homebtn{position:absolute;left:50%;bottom:33%;transform:translateX(-50%);z-index:6;background:rgba(14,12,22,.8);border:2px solid rgba(255,255,255,.35);border-radius:14px;color:#f2ead8;font-weight:700;font-size:.78rem;padding:9px 14px}
/* ============ store ============ */
#keeper{position:absolute;left:3%;top:calc(6px + env(safe-area-inset-top));z-index:3;width:22%;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5))}
#clientbox{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:4;width:60%;display:flex;flex-direction:column;align-items:center;transition:transform .45s,opacity .45s}
#clientbox.out{transform:translateX(-140%);opacity:0}
#clientbox.in{transform:translateX(140%);opacity:0}
#clientimg{width:56%;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
#bubble{position:relative;width:100%;background:url("assets/ui_bubble.png") 0 0/100% 100% no-repeat;padding:9% 10% 13%;margin-bottom:-4%;color:#4a3418;z-index:2}
#bubble .oline{display:flex;align-items:center;gap:6px;justify-content:center;font-weight:800;font-size:.82rem;margin:2px 0}
#bubble .oline img{width:26px;height:26px;object-fit:contain}
#bubble .pay{margin-top:3px;text-align:center;font-weight:800;font-size:.8rem;color:#7a5310}
#counters{position:absolute;left:50%;top:52.5%;transform:translateX(-50%);z-index:4;display:flex;gap:4%;width:88%}
.ctable{position:relative;width:48%;aspect-ratio:240/143}
.ctable>img{position:absolute;inset:0;width:100%;height:100%}
.ctable .slot{position:absolute;top:4%;width:38%;height:56%}
.ctable .slot.s0{left:9%}.ctable .slot.s1{right:9%}
#rack{position:absolute;left:2%;right:22%;top:70%;z-index:4;display:flex;gap:2%;justify-content:center}
.rackitem{flex:1;max-width:19%;background:linear-gradient(#5c3f24,#402a15);border:2px solid #9a6f3a;border-radius:12px;padding:5px 2px 3px;text-align:center;color:#f2ead8}
.rackitem .re{font-size:clamp(16px,5.6vw,24px);line-height:1.15}
.rackitem .rp{font-size:.62rem;font-weight:800;color:#ffd97a}
.rackitem.cant{opacity:.45}
#barrel{position:absolute;right:3%;top:69%;z-index:5;width:16%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#7a4d26,#4c2e13);border:2px solid #a97b42;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,.5)}
#barrel .be{font-size:clamp(16px,6vw,26px)}
#barrel .bt{font-size:.56rem;font-weight:800;letter-spacing:.08em}
#barrel.hov{box-shadow:0 0 16px rgba(255,215,120,.9)}
.exitdoor{position:absolute;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:22;width:56px;height:56px;border:none;background:url("assets/icon_exit.png") center/contain no-repeat;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
#storebanner{position:absolute;left:50%;top:88%;transform:translateX(-50%);z-index:4;font-weight:800;letter-spacing:.3em;font-size:.8rem;opacity:.7;text-shadow:0 1px 3px #000;pointer-events:none}
/* ============ overlays / toasts ============ */
.overlay{position:absolute;inset:0;z-index:60;background:rgba(8,8,14,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8%}
.overlay h2{font-size:1.5rem;margin-bottom:10px}
.overlay p{opacity:.85;line-height:1.5;margin-bottom:22px;font-size:.92rem}
.btn{background:linear-gradient(#ffd069,#e2a83e);border:2px solid #fff0c8;border-radius:14px;color:#3a2508;font-weight:800;font-size:1rem;padding:12px 22px;box-shadow:0 4px 10px rgba(0,0,0,.5)}
#splash h1{font-size:2.6rem;letter-spacing:.42em;margin-bottom:4px;text-indent:.42em;color:#ffd97a;text-shadow:0 0 24px rgba(255,205,100,.55)}
#splash .sub{opacity:.7;font-size:.82rem;margin-bottom:30px}
#toasts{position:absolute;left:50%;top:16%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:92%}
.toast{background:rgba(14,12,22,.92);border:1px solid rgba(255,210,120,.55);border-radius:999px;padding:7px 16px;font-size:.8rem;font-weight:700;text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.5);animation:tin .22s}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
#undopill{position:absolute;left:50%;bottom:calc(52.2vw + 10px);transform:translateX(-50%);z-index:81;background:rgba(14,12,22,.94);border:1px solid rgba(255,120,90,.6);border-radius:999px;padding:8px 8px 8px 14px;font-size:.78rem;font-weight:700;display:none;align-items:center;gap:10px}
@media (min-width:480px){#undopill{bottom:262px}}
#undopill button{background:#ffd069;border:none;border-radius:999px;font-weight:800;padding:5px 12px;color:#3a2508}
.fly{position:fixed;z-index:90;pointer-events:none;transition:all .38s cubic-bezier(.35,.8,.45,1);width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.fly.emo{font-size:34px;line-height:44px;text-align:center}
#ghost{position:fixed;z-index:95;pointer-events:none;width:52px;height:52px;display:none;align-items:center;justify-content:center;transform:translate(-50%,-55%)}
#ghost img{width:100%;height:100%;object-fit:contain}
#ghost .emo{font-size:38px}
#jsbadge{position:absolute;left:6px;bottom:calc(4px + env(safe-area-inset-bottom));z-index:99;font-size:.58rem;opacity:.55;color:#9be29b;pointer-events:none}
.dbg{position:absolute;border:1.5px dashed #35ffd0;background:rgba(53,255,208,.12);z-index:70;pointer-events:none;font-size:.5rem;color:#35ffd0}
.mergeflash{animation:mf .5s}
@keyframes mf{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
</style>
</head>
<body>
<div id="app">

  <!-- TOWN -->
  <div class="screen" id="sc-town">
    <button class="tile" id="t-mine" data-btn="region" data-region="mine"><img src="assets/tile_mine.webp"><span class="tname">Mine</span></button>
    <button class="tile" id="t-woods" data-btn="region" data-region="woods"><img src="assets/tile_woods.webp"><span class="tname">Woods</span></button>
    <button class="tile" id="t-lake" data-btn="region" data-region="lake"><img src="assets/tile_lake.webp"><span class="tname">Lake</span></button>
    <button class="tile" id="t-store" data-btn="store"><img src="assets/tile_store.webp"><span class="tname">Store</span></button>
    <div id="storagewrap">
      <h3>HOME STORAGE</h3>
      <div id="storage"></div>
    </div>
  </div>

  <!-- EXPEDITION -->
  <div class="screen" id="sc-run">
    <div id="nodes"></div>
    <button class="doorbtn" id="doorL" data-btn="deeper">➜ deeper −5☀</button>
    <button class="doorbtn" id="doorR" data-btn="deeper">deeper ➜ −5☀</button>
    <button id="homebtn" data-btn="home">🏠 Go home</button>
  </div>

  <!-- STORE -->
  <div class="screen" id="sc-shop">
    <img id="keeper" src="assets/client_cliff.webp" alt="Cliff">
    <div id="clientbox">
      <div id="bubble"></div>
      <img id="clientimg" src="assets/client_cindey.webp">
    </div>
    <div id="counters">
      <div class="ctable"><img src="assets/ui_counter.png">
        <div class="slot s0" data-zone="counter" data-idx="0"></div>
        <div class="slot s1" data-zone="counter" data-idx="1"></div>
      </div>
      <div class="ctable"><img src="assets/ui_counter.png">
        <div class="slot s0" data-zone="counter" data-idx="2"></div>
        <div class="slot s1" data-zone="counter" data-idx="3"></div>
      </div>
    </div>
    <div id="rack"></div>
    <div id="barrel" data-drop="barrel"><span class="be">🛢️</span><span class="bt">SELL</span></div>
    <button class="exitdoor" data-btn="exitstore" aria-label="to town"></button>
    <div id="storebanner">S T O R E</div>
  </div>

  <!-- shared: sun bar -->
  <div id="sunwrap" style="display:none">
    <div class="frame">
      <div id="sunfillzone"><div id="sunfill"></div></div>
      <img src="assets/sunbar_frame.png">
      <span id="suntext">40</span>
    </div>
  </div>
  <div id="roomlabel" style="display:none"></div>

  <!-- bottom bar -->
  <div id="bar">
    <img src="assets/bottombar.png">
    <div class="hot" id="dayorb"></div>
    <div class="hot" id="coinorb"></div>
    <div class="hot" id="trashhex" data-drop="trash"></div>
  </div>

  <!-- overlays -->
  <div class="overlay" id="splash">
    <h1>LUMEN</h1>
    <div class="sub">one expedition a day</div>
    <button class="btn" data-btn="begin">Begin</button>
  </div>
  <div class="overlay" id="endscreen" style="display:none">
    <h2 id="endtitle"></h2>
    <p id="endsub"></p>
    <button class="btn" data-btn="endok">🏘 Back to town</button>
  </div>

  <div id="toasts"></div>
  <div id="undopill"><span id="undotext"></span><button data-btn="undo">Undo</button></div>
  <div id="ghost"></div>
  <div id="jsbadge">A10 js:…</div>
</div>

<script>
"use strict";
/* =================================================================
   LUMEN A10-clean — state first, DOM second. All gameplay facts in G.
   ================================================================= */
window.onerror = function(msg, src, line){ try{ toast("⚠ "+msg+" @"+line); }catch(e){} };

/* ---------- data ---------- */
const SUN_MAX = 40, BAG_N = 6, STO_N = 12, CTR_N = 4;
const MATS = {
  stone:{cls:"common"}, copper:{cls:"unc"}, crystal:{cls:"rare"},
  logs:{cls:"unc"}, leaves:{cls:"common"}, moonbloom:{cls:"rare"},
  water:{cls:"common"}, shell:{cls:"unc"}, pearl:{cls:"rare"}
};
const SELLV = { common:[1,2,5,12,30,80], unc:[3,7,16,40,90,200], rare:[6,14,32,80,180,420] };
const TOOLS = {
  pick:{e:"⛏️",price:15,names:["Pick","Steel Pick","Golden Pick"]},
  axe:{e:"🪓",price:15,names:["Axe","Steel Axe","Golden Axe"]},
  scythe:{e:"🌾",price:15,names:["Scythe","Steel Scythe","Golden Scythe"]},
  shovel:{e:"🪏",price:20,names:["Shovel","Steel Shovel","Golden Shovel"]},
  rod:{e:"🎣",price:25,names:["Rod","Steel Rod","Golden Rod"]}
};
const NODES = {
  stone:{tool:"pick", hp:3, ico:"🪨", drops:[["stone",.70],["copper",.22],["crystal",.08]]},
  tree:{tool:"axe",  hp:3, ico:"🌳", drops:[["logs",.92],["shroom",.08]]},
  bush:{tool:"scythe",hp:2, ico:"🌿", drops:[["leaves",.78],["shroom",.10],["moonbloom",.12]]},
  dig:{tool:"shovel",hp:2, ico:"🕳️", drops:"dig"},
  pool:{tool:"rod",  hp:3, img:"assets/tile_lake.webp", drops:[["water",.70],["shell",.22],["pearl",.08]]}
};
const REGIONS = {
  mine:{name:"MINE", cost:0,  bio:"bio-mine",  weights:[["stone",.65],["dig",.35]], mats:["stone","copper","crystal"]},
  woods:{name:"WOODS",cost:40, bio:"bio-woods", weights:[["tree",.50],["bush",.40],["dig",.10]], mats:["logs","leaves","moonbloom"]},
  lake:{name:"LAKE", cost:80, bio:"bio-lake",  weights:[["pool",.80],["dig",.20]], mats:["water","shell","pearl"]}
};
const CLIENTS = ["cindey","gretta","marvin","milly","rondel","walter"];
const CLIENT_NAMES = {cindey:"Cindey",gretta:"Gretta",marvin:"Marvin",milly:"Milly",rondel:"Rondel",walter:"Walter"};
const NODE_POS = [[22,26],[63,23],[40,36],[78,41],[24,48],[60,53],[42,57],[79,56]];
const ROMAN = ["I","II","III","IV","V","VI"];
/* bag-bar hotspots — % of bar box; verify with ?debug=slots */
const BAR = {
  slots:{ xs:[9.7,23.2,36.7], ys:[25,50], w:12.9, h:24.8 },
  day:[64.2,29,8.5,15], coins:[77.5,27,10.5,18], trash:[60,77,26,21]
};

/* emoji support check — swap tofu glyphs for safe fallbacks */
function emojiOK(ch){
  try{
    const c=document.createElement("canvas"); c.width=c.height=32;
    const x=c.getContext("2d"); x.textBaseline="top"; x.font="28px sans-serif"; x.fillText(ch,0,0);
    const d=x.getImageData(0,0,32,32).data, cols=new Set();
    for(let i=0;i<d.length;i+=4) if(d[i+3]>40) cols.add((d[i]>>4)|((d[i+1]>>4)<<4)|((d[i+2]>>4)<<8));
    return cols.size>4;
  }catch(e){ return true; }
}
if(!emojiOK("🪏")) TOOLS.shovel.e="🥄";

/* ---------- state ---------- */
const G = {
  ver:"A10", screen:"town",
  day:1, coins:10, sun:SUN_MAX,
  bag:Array(BAG_N).fill(null),
  storage:Array(STO_N).fill(null),
  counter:Array(CTR_N).fill(null),
  regions:{mine:true, woods:false, lake:false},
  run:null,                       // {region, room, nodes:[{type,hp,max,x,y,dead}]}
  store:{queue:[], client:null, order:null, busy:false},
  trash:null                      // {item, zone, idx, timer}
};
G.bag[0] = {t:"tool", c:"pick", r:1};
G.bag[1] = {t:"tool", c:"axe",  r:1};

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pickW(pairs, bonus){ // bonus shifts weight from first→last entry (rare)
  let ws = pairs.map(p=>p[1]);
  if(bonus){ ws = ws.slice(); ws[ws.length-1]+=bonus; ws[0]=Math.max(0.02, ws[0]-bonus); }
  const tot = ws.reduce((a,b)=>a+b,0);
  let r = Math.random()*tot;
  for(let i=0;i<pairs.length;i++){ r-=ws[i]; if(r<=0) return pairs[i][0]; }
  return pairs[pairs.length-1][0];
}
function itemName(it){
  if(!it) return "";
  if(it.t==="shroom") return "Mushroom";
  if(it.t==="tool") return TOOLS[it.c].names[it.r-1];
  return it.c[0].toUpperCase()+it.c.slice(1)+" "+ROMAN[it.r-1];
}
function sellValue(it){
  if(it.t==="shroom") return 2*(it.n||1);
  if(it.t==="tool") return Math.round(TOOLS[it.c].price*[0.4,1.2,3][it.r-1]);
  return SELLV[MATS[it.c].cls][it.r-1];
}
function matValue(c,r){ return SELLV[MATS[c].cls][r-1]; }
function freeSlot(arr){ return arr.findIndex(x=>!x); }
function bestTool(chain){
  let best=0;
  for(const it of G.bag) if(it && it.t==="tool" && it.c===chain && it.r>best) best=it.r;
  return best;
}
function unlockedRegions(){ return Object.keys(G.regions).filter(k=>G.regions[k]); }

/* ---------- toasts / pills / fly ---------- */
function toast(msg, ms){
  const el = document.createElement("div");
  el.className="toast"; el.textContent=msg;
  $("#toasts").appendChild(el);
  setTimeout(()=>el.remove(), ms||1900);
}
function clearToasts(){ $("#toasts").innerHTML=""; $("#undopill").style.display="none"; if(G.trash){clearTimeout(G.trash.timer);G.trash=null;} }
function itemNodeHTML(it){
  if(!it) return "";
  if(it.t==="shroom") return `<span class="emo">🍄</span>${it.n>1?`<span class="cnt">×${it.n}</span>`:""}`;
  if(it.t==="tool")  return `<span class="emo">${TOOLS[it.c].e}</span><span class="tier">${ROMAN[it.r-1]}</span>`;
  return `<img src="assets/mat_${it.c}_${it.r}.webp" alt="${itemName(it)}">`;
}
function flyToSlot(fromRect, zone, idx, it){
  try{
    const dest = document.querySelector(`.slot[data-zone="${zone}"][data-idx="${idx}"]`);
    if(!fromRect || !dest) return;
    const dr = dest.getBoundingClientRect();
    if(!dr.width) return;
    let el;
    if(it.t==="mat"){ el=document.createElement("img"); el.src=`assets/mat_${it.c}_${it.r}.webp`; el.className="fly"; }
    else { el=document.createElement("div"); el.className="fly emo"; el.textContent = it.t==="shroom"?"🍄":TOOLS[it.c].e; }
    el.style.left=(fromRect.left+fromRect.width/2-22)+"px";
    el.style.top=(fromRect.top+fromRect.height/2-22)+"px";
    document.body.appendChild(el);
    requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
      el.style.left=(dr.left+dr.width/2-22)+"px";
      el.style.top=(dr.top+dr.height/2-22)+"px";
      el.style.transform="scale(.55)"; el.style.opacity=".85";
    });});
    setTimeout(()=>el.remove(), 480);
  }catch(e){}
}

/* ---------- rendering ---------- */
function slotHTML(zone, idx, it){
  return `<div class="slot" data-zone="${zone}" data-idx="${idx}">${itemNodeHTML(it)}</div>`;
}
function renderBar(){
  // build hotspot slots once
  const bar = $("#bar");
  if(!bar.dataset.built){
    let html = "";
    for(let r=0;r<2;r++) for(let c=0;c<3;c++){
      const i=r*3+c;
      html += `<div class="hot slot" data-zone="bag" data-idx="${i}" style="left:${BAR.slots.xs[c]}%;top:${BAR.slots.ys[r]}%;width:${BAR.slots.w}%;height:${BAR.slots.h}%"></div>`;
    }
    bar.insertAdjacentHTML("beforeend", html);
    const put=(id,b)=>{const el=$(id);el.style.left=b[0]+"%";el.style.top=b[1]+"%";el.style.width=b[2]+"%";el.style.height=b[3]+"%";};
    put("#dayorb",BAR.day); put("#coinorb",BAR.coins); put("#trashhex",BAR.trash);
    bar.dataset.built="1";
  }
  bar.querySelectorAll('.slot[data-zone="bag"]').forEach(el=>{
    el.innerHTML = itemNodeHTML(G.bag[+el.dataset.idx]);
  });
  $("#dayorb").textContent = G.day;
  $("#coinorb").textContent = G.coins;
}
function renderSun(){
  const pct = Math.max(0, G.sun/SUN_MAX*100);
  $("#sunfill").style.width = pct+"%";
  $("#suntext").textContent = Math.max(0,G.sun);
  const sc = $("#sc-run");
  sc.classList.toggle("dusk1", pct<=70 && pct>40);
  sc.classList.toggle("dusk2", pct<=40 && pct>18);
  sc.classList.toggle("dusk3", pct<=18);
}
function renderTown(){
  for(const k of ["mine","woods","lake"]){
    const el = $("#t-"+k), locked = !G.regions[k];
    el.classList.toggle("locked", locked);
    let lock = el.querySelector(".lock");
    if(locked){
      if(!lock){ lock=document.createElement("span"); lock.className="lock"; el.appendChild(lock); }
      lock.textContent = "🔒 "+REGIONS[k].cost+" 🪙";
    } else if(lock) lock.remove();
  }
  $("#storage").innerHTML = G.storage.map((it,i)=>slotHTML("storage",i,it)).join("");
}
function renderRun(){
  const sc=$("#sc-run"), run=G.run; if(!run) return;
  sc.className = "screen on "+REGIONS[run.region].bio;
  renderSun();
  $("#roomlabel").textContent = `${REGIONS[run.region].name} · ROOM ${run.room} · DAY ${G.day}`;
  $("#nodes").innerHTML = run.nodes.map((n,i)=>{
    const nt = NODES[n.type];
    const pips = Array.from({length:n.max},(_,j)=>`<i class="${j<n.hp?"":"off"}"></i>`).join("");
    const body = nt.img ? `<img class="nimg" src="${nt.img}">` : `<span class="nico">${nt.ico}</span>`;
    return `<button class="node${n.dead?" dead":""}" data-node="${i}" style="left:${n.x}%;top:${n.y}%">
      ${body}<span class="badge">${TOOLS[nt.tool].e}</span>
      ${n.dead?"":`<span class="pips">${pips}</span>`}</button>`;
  }).join("");
}
function renderShop(){
  const st=G.store;
  if(st.client){
    $("#clientimg").src = `assets/client_${st.client}.webp`;
    $("#bubble").innerHTML = st.order.lines.map(L=>{
      const have = counterCount(L.c,L.r);
      return `<div class="oline"><img src="assets/mat_${L.c}_${L.r}.webp">×${L.n} ${have>=L.n?"✅":""}</div>`;
    }).join("") + `<div class="pay">pays 🪙 ${st.order.pay}</div>`;
  } else $("#bubble").innerHTML = "";
  document.querySelectorAll('#counters .slot').forEach(el=>{
    el.innerHTML = itemNodeHTML(G.counter[+el.dataset.idx]);
  });
  $("#rack").innerHTML = Object.keys(TOOLS).map(k=>
    `<button class="rackitem${G.coins<TOOLS[k].price?" cant":""}" data-btn="buy" data-tool="${k}">
      <div class="re">${TOOLS[k].e}</div><div class="rp">${TOOLS[k].price} 🪙</div></button>`).join("");
}
function showScreen(name){
  clearToasts();
  G.screen = name;
  $("#sc-town").classList.toggle("on", name==="town");
  $("#sc-run").classList.toggle("on", name==="run");
  $("#sc-shop").classList.toggle("on", name==="shop");
  $("#sunwrap").style.display = name==="run"?"block":"none";
  $("#roomlabel").style.display = name==="run"?"block":"none";
  render();
}
function render(){
  renderBar();
  if(G.screen==="town") renderTown();
  else if(G.screen==="run") renderRun();
  else if(G.screen==="shop") renderShop();
  if(DEBUG_SLOTS) drawDebug();
}

/* ---------- expedition logic ---------- */
function genNodes(region, room){
  const count = Math.min(NODE_POS.length, ri(4,6) + (room>1?1:0));
  const pos = NODE_POS.slice().sort(()=>Math.random()-.5).slice(0,count);
  return pos.map(p=>{
    const type = pickW(REGIONS[region].weights, 0);
    return {type, hp:NODES[type].hp, max:NODES[type].hp, x:p[0], y:p[1], dead:false};
  });
}
function startRun(region){
  G.sun = SUN_MAX;
  G.run = {region, room:1, nodes:genNodes(region,1)};
  showScreen("run");
}
function rareBonus(){ return Math.min(0.10, (G.run.room-1)*0.015); }
function giveMat(c, r, fromRect){
  // shroom stacking
  if(c==="shroom"){
    let i = G.bag.findIndex(x=>x&&x.t==="shroom");
    if(i>=0){ G.bag[i].n++; render(); flyToSlot(fromRect,"bag",i,{t:"shroom"}); return true; }
    i = freeSlot(G.bag); if(i<0) return false;
    G.bag[i]={t:"shroom",n:1}; render(); flyToSlot(fromRect,"bag",i,{t:"shroom"}); return true;
  }
  const i = freeSlot(G.bag); if(i<0) return false;
  const it = {t:"mat", c, r:r||1};
  G.bag[i]=it; render(); flyToSlot(fromRect,"bag",i,it);
  return true;
}
function tapNode(idx, el){
  const run=G.run; if(!run || G.sun<=0) return;
  const n = run.nodes[idx]; if(!n || n.dead) return;
  const nt = NODES[n.type];
  const tier = bestTool(nt.tool);
  if(!tier){ toast("Needs a "+TOOLS[nt.tool].names[0]+" "+TOOLS[nt.tool].e); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); return; }
  if(freeSlot(G.bag)<0){ toast("Bag full — merge or toss something"); return; }
  G.sun--; n.hp -= tier;
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  if(n.hp<=0){
    n.dead = true;
    const rect = el.getBoundingClientRect();
    if(nt.drops==="dig"){
      const roll = Math.random();
      if(roll<0.55){ const amt = ri(3,8)+2*(run.room-1); G.coins+=amt; toast("🪙 +"+amt); }
      else if(roll<0.75){ toast("…nothing but old roots"); }
      else{ const c = pickW(REGIONS[run.region].mats.map((m,i)=>[m,[.70,.22,.08][i]]), rareBonus()); giveMat(c,1,rect); }
    } else {
      const c = pickW(nt.drops, rareBonus());
      giveMat(c,1,rect);
    }
  }
  render();
  if(G.sun<=0) endRun(false);
}
function goDeeper(){
  if(!G.run) return;
  G.sun -= 5;
  if(G.sun<=0){ render(); endRun(false); return; }
  G.run.room++;
  G.run.nodes = genNodes(G.run.region, G.run.room);
  render();
}
function endRun(home){
  const kept = G.bag.filter(x=>x&&x.t==="tool").length;
  let lost=0, brought=0;
  if(home){
    brought = G.bag.filter(x=>x&&x.t!=="tool").length;
  } else {
    G.bag = G.bag.map(x => (x && x.t==="mat") ? (lost++, null) : x);
  }
  G.day++; G.run=null;
  $("#endtitle").textContent = home ? "🏠 Home before dark" : "🌙 The sun set…";
  $("#endsub").textContent = home
    ? `Day ${G.day-1} done. Bag came home safe (${brought} finds, ${kept} tools).`
    : `Day ${G.day-1} over. ${lost} material${lost===1?"":"s"} lost to the dark — ${kept} tool${kept===1?"":"s"} and your mushrooms made it back.`;
  $("#endscreen").style.display="flex";
  render();
}
function eatShroom(idx){
  const it = G.bag[idx]; if(!it || it.t!=="shroom") return;
  if(G.screen!=="run"){ toast("🍄 Save it for the road"); return; }
  if(G.sun>=SUN_MAX){ toast("Sun is full"); return; }
  it.n--; if(it.n<=0) G.bag[idx]=null;
  G.sun = Math.min(SUN_MAX, G.sun+8);
  toast("🍄 +8 ☀");
  render();
}

/* ---------- town / regions ---------- */
function tapRegion(key){
  if(!G.regions[key]){
    const cost = REGIONS[key].cost;
    if(G.coins < cost){ toast(`Need ${cost} 🪙 to open the ${REGIONS[key].name.toLowerCase()}`); return; }
    G.coins -= cost; G.regions[key]=true;
    toast("✦ "+REGIONS[key].name+" unlocked! ✦");
  }
  startRun(key);
}

/* ---------- store ---------- */
function counterCount(c,r){
  return G.counter.reduce((a,it)=> a + ((it&&it.t==="mat"&&it.c===c&&it.r===r)?1:0), 0);
}
function newOrder(){
  const regs = unlockedRegions();
  const nl = ri(1,2), lines=[];
  for(let i=0;i<nl;i++){
    const reg = regs[ri(0,regs.length-1)];
    const c = REGIONS[reg].mats[ri(0,2)];
    const tr = Math.random(); const r = tr<0.5?1:(tr<0.85?2:3);
    const n = r===1?ri(1,2):1;
    if(lines.some(L=>L.c===c&&L.r===r)){ i--; continue; }
    lines.push({c,r,n});
  }
  const pay = Math.max(4, Math.round(1.7*lines.reduce((a,L)=>a+matValue(L.c,L.r)*L.n,0)));
  return {lines, pay};
}
function nextClient(animate){
  const st=G.store;
  if(!st.queue.length) st.queue = CLIENTS.slice().sort(()=>Math.random()-.5);
  st.client = st.queue.pop();
  st.order = newOrder();
  if(animate){
    const box=$("#clientbox");
    box.classList.add("in"); renderShop();
    requestAnimationFrame(()=>requestAnimationFrame(()=>box.classList.remove("in")));
  } else renderShop();
}
function checkOrder(){
  const st=G.store;
  if(!st.client || st.busy) return;
  if(!st.order.lines.every(L=>counterCount(L.c,L.r)>=L.n)) { renderShop(); return; }
  // consume
  for(const L of st.order.lines){
    let need=L.n;
    G.counter = G.counter.map(it=>{
      if(need>0 && it && it.t==="mat" && it.c===L.c && it.r===L.r){ need--; return null; }
      return it;
    });
  }
  G.coins += st.order.pay;
  toast(`🪙 +${st.order.pay} — “Thank you!” —${CLIENT_NAMES[st.client]}`);
  st.busy = true;
  const box=$("#clientbox"); box.classList.add("out");
  render();
  setTimeout(()=>{
    box.classList.remove("out");
    st.busy=false;
    nextClient(true);
    render();
  }, 700);
}
function buyTool(key){
  const p = TOOLS[key].price;
  if(G.coins<p){ toast("Not enough coins"); return; }
  const it={t:"tool",c:key,r:1};
  let i=freeSlot(G.bag), zone="bag";
  if(i<0){ i=freeSlot(G.storage); zone="storage"; }
  if(i<0){ toast("No room anywhere — make space first"); return; }
  G.coins-=p; G[zone][i]=it;
  toast("✦ "+TOOLS[key].names[0]+" ✦"+(zone==="storage"?" → storage":""));
  render();
}
function sellItem(zone, idx){
  const it = G[zone][idx]; if(!it) return;
  const v = sellValue(it);
  G[zone][idx]=null; G.coins+=v;
  toast(`Sold ${itemName(it)} 🪙 +${v}`);
  render();
}

/* ---------- trash / undo ---------- */
function trashItem(zone, idx){
  const it=G[zone][idx]; if(!it) return;
  if(G.trash){ clearTimeout(G.trash.timer); G.trash=null; }
  G[zone][idx]=null;
  G.trash = {item:it, zone, idx, timer:setTimeout(()=>{ G.trash=null; $("#undopill").style.display="none"; },3000)};
  $("#undotext").textContent = "Trashed "+itemName(it);
  $("#undopill").style.display="flex";
  render();
}
function undoTrash(){
  const t=G.trash; if(!t) return;
  clearTimeout(t.timer); G.trash=null;
  $("#undopill").style.display="none";
  let zone=t.zone, i = !G[t.zone][t.idx] ? t.idx : freeSlot(G[t.zone]);
  if(i<0){ zone="bag"; i=freeSlot(G.bag); }
  if(i<0){ zone="storage"; i=freeSlot(G.storage); }
  if(i<0){ toast("No space to bring it back"); G.trash=null; return; }
  G[zone][i]=t.item;
  render();
}

/* ---------- drag & drop ---------- */
function zoneAllowed(zone){
  if(zone==="bag") return true;
  if(zone==="storage") return G.screen==="town";
  if(zone==="counter") return G.screen==="shop";
  return false;
}
function dropItem(fromZone, fromIdx, toZone, toIdx){
  const src = G[fromZone][fromIdx]; if(!src) return;
  if(fromZone===toZone && fromIdx===toIdx) return;
  if(!zoneAllowed(toZone)) return;
  if(toZone==="counter" && src.t!=="mat"){ toast(src.t==="tool"?"Tools stay with you":"That's not for the counter"); return; }
  const dst = G[toZone][toIdx];
  if(!dst){
    G[toZone][toIdx]=src; G[fromZone][fromIdx]=null;
  } else {
    const identical = dst.t===src.t && dst.c===src.c && dst.r===src.r;
    const bothShroom = dst.t==="shroom" && src.t==="shroom";
    if(bothShroom){
      if(toZone==="bag"){ dst.n+=src.n; G[fromZone][fromIdx]=null; }
      else { toast("Merging only happens in your bag"); return; }
    } else if(identical && src.t!=="shroom"){
      if(toZone!=="bag"){ toast("Merging only happens in your bag"); return; }
      const cap = src.t==="tool"?3:6;
      if(src.r>=cap){ toast("Already at max tier"); return; }
      G[toZone][toIdx]={t:src.t,c:src.c,r:src.r+1};
      G[fromZone][fromIdx]=null;
      toast("✦ "+itemName(G[toZone][toIdx])+"! ✦");
      render();
      const el=document.querySelector(`.slot[data-zone="${toZone}"][data-idx="${toIdx}"]`);
      if(el){ el.classList.remove("mergeflash"); void el.offsetWidth; el.classList.add("mergeflash"); }
      if(toZone==="counter"||fromZone==="counter") checkOrder();
      return;
    } else if(fromZone===toZone){
      G[toZone][toIdx]=src; G[fromZone][fromIdx]=dst; // swap within zone
    } else { return; } // cross-zone onto different item: bounce
  }
  render();
  if(toZone==="counter"||fromZone==="counter") checkOrder();
}

const drag = {on:false, moved:false, zone:null, idx:-1, sx:0, sy:0, el:null};
function dragGhost(it){
  const g=$("#ghost");
  g.innerHTML = it.t==="mat" ? `<img src="assets/mat_${it.c}_${it.r}.webp">` : `<span class="emo">${it.t==="shroom"?"🍄":TOOLS[it.c].e}</span>`;
  g.style.display="flex";
}
document.addEventListener("pointerdown", e=>{
  // nodes: fastTap on pointerdown, zero throttling
  const node = e.target.closest(".node");
  if(node && G.screen==="run"){ e.preventDefault(); tapNode(+node.dataset.node, node); return; }
  const slot = e.target.closest(".slot[data-zone]");
  if(slot){
    const zone=slot.dataset.zone, idx=+slot.dataset.idx;
    if(!G[zone][idx]) return;
    drag.on=true; drag.moved=false; drag.zone=zone; drag.idx=idx;
    drag.sx=e.clientX; drag.sy=e.clientY; drag.el=slot;
  }
});
document.addEventListener("pointermove", e=>{
  if(!drag.on) return;
  if(!drag.moved){
    if(Math.hypot(e.clientX-drag.sx, e.clientY-drag.sy) < 8) return;
    drag.moved=true;
    dragGhost(G[drag.zone][drag.idx]);
    drag.el.classList.add("dragsrc");
  }
  const g=$("#ghost"); g.style.left=e.clientX+"px"; g.style.top=e.clientY+"px";
});
document.addEventListener("pointerup", e=>{
  if(!drag.on) return;
  const was={...drag};
  drag.on=false; $("#ghost").style.display="none";
  if(was.el) was.el.classList.remove("dragsrc");
  if(!was.moved){
    // tap on slot: eat shroom
    const it=G[was.zone][was.idx];
    if(it && it.t==="shroom" && was.zone==="bag") eatShroom(was.idx);
    return;
  }
  const els = document.elementsFromPoint(e.clientX, e.clientY);
  for(const el of els){
    if(el.dataset && el.dataset.drop==="trash"){ trashItem(was.zone, was.idx); return; }
    if(el.dataset && el.dataset.drop==="barrel"){
      const it=G[was.zone][was.idx];
      if(it.t==="tool" && it.r===1) toast("Sold "+itemName(it)+" 🪙 +"+sellValue(it));
      sellItem(was.zone, was.idx); return;
    }
    const slot = el.closest ? el.closest(".slot[data-zone]") : null;
    if(slot){ dropItem(was.zone, was.idx, slot.dataset.zone, +slot.dataset.idx); return; }
  }
});

/* ---------- buttons (tap on pointerup, ghost-click suppression, no rate lock) ---------- */
const tapState = {t:0, x:0, y:0};
document.addEventListener("pointerdown", e=>{
  const b=e.target.closest("[data-btn]");
  if(b){ tapState.t=performance.now(); tapState.x=e.clientX; tapState.y=e.clientY; }
}, true);
document.addEventListener("pointerup", e=>{
  const b=e.target.closest("[data-btn]");
  if(!b) return;
  if(Math.hypot(e.clientX-tapState.x, e.clientY-tapState.y) > 14) return;
  e.preventDefault();
  doBtn(b);
});
document.addEventListener("click", e=>{ // ghost click suppression
  const b=e.target.closest("[data-btn]");
  if(b) e.preventDefault();
});
function doBtn(b){
  const k=b.dataset.btn;
  if(k==="begin"){ $("#splash").style.display="none"; showScreen("town"); }
  else if(k==="region") tapRegion(b.dataset.region);
  else if(k==="store"){ showScreen("shop"); if(!G.store.client) nextClient(false); render(); }
  else if(k==="exitstore") showScreen("town");
  else if(k==="deeper") goDeeper();
  else if(k==="home") endRun(true);
  else if(k==="endok"){ $("#endscreen").style.display="none"; showScreen("town"); }
  else if(k==="buy") buyTool(b.dataset.tool);
  else if(k==="undo") undoTrash();
}

/* ---------- dev cheat: triple-tap sun bar ---------- */
let sunTaps=[];
$("#sunwrap").addEventListener("pointerdown", ()=>{
  const now=performance.now();
  sunTaps = sunTaps.filter(t=>now-t<600); sunTaps.push(now);
  if(sunTaps.length>=3){ sunTaps=[]; G.sun=SUN_MAX; toast("🧪 dev"); render(); }
});

/* ---------- scroll lock ---------- */
document.addEventListener("touchmove", e=>e.preventDefault(), {passive:false});

/* ---------- debug overlay ---------- */
const DEBUG_SLOTS = /debug=slots/.test(location.search);
function drawDebug(){
  document.querySelectorAll(".dbg").forEach(el=>el.remove());
  const bar=$("#bar");
  bar.querySelectorAll(".hot").forEach(el=>{
    const d=document.createElement("div"); d.className="dbg";
    d.style.left=el.style.left; d.style.top=el.style.top; d.style.width=el.style.width; d.style.height=el.style.height;
    d.textContent=el.dataset.idx ?? el.id;
    bar.appendChild(d);
  });
}

/* ---------- boot ---------- */
window.G = G;
window.ACT = {startRun, tapNode, goDeeper, endRun, tapRegion, buyTool, nextClient, checkOrder, dropItem, render, showScreen, newOrder, eatShroom};
showScreen("town");
$("#splash").style.display="flex";
$("#jsbadge").textContent="A10 js:✓";
</script>
</body>
